name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C5CFF&color_dots=#EEE7FF,#D9CCFF,#B9A3FF,#9171FF,#6D4AE8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C4B5FD&color_dots=#1E1530,#3B2A6B,#5B3FB0,#7C5CFF,#A78BFA

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
